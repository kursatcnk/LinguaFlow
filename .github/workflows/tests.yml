name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # WPF ve Windows ses API'leri yüzünden yalnızca Windows'ta derleniyor.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test LinguaFlow.slnx --configuration Release
